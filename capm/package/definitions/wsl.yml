image: alpine:3.24.2
version: 5.9.0
install_command: |
  apk add go
  go install github.com/bombsimon/wsl/v5/cmd/wsl@v{version}
entrypoint: /root/go/bin/wsl
args: '{workspace}/...'
about: Enforces empty lines at the right places in Go code.
website: https://github.com/bombsimon/wsl
type: linter
technology: go
workspace_mode: ro
