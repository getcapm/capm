image: php:8.4-cli-alpine
version: 1.0.6
install_command: |
  export COMPOSER_HOME=/opt/composer COMPOSER_ALLOW_SUPERUSER=1
  apk add git unzip
  wget -qO /usr/local/bin/composer https://getcomposer.org/download/latest-2.x/composer.phar
  chmod +x /usr/local/bin/composer
  composer global require wapmorgan/php-code-analyzer:{version}
entrypoint: /opt/composer/vendor/bin/phpca
args: '{workspace}'
about: Finds usage of non-built-in PHP extensions in PHP code.
website: https://github.com/wapmorgan/PhpCodeAnalyzer
type: analyzer
technology: php
workspace_mode: ro
