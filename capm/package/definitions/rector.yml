image: php:8.4-cli-alpine
version: 2.7.0
install_command: |
  export COMPOSER_HOME=/opt/composer COMPOSER_ALLOW_SUPERUSER=1
  apk add git unzip
  wget -qO /usr/local/bin/composer https://getcomposer.org/download/latest-2.x/composer.phar
  chmod +x /usr/local/bin/composer
  composer global require rector/rector:{version}
entrypoint: /opt/composer/vendor/bin/rector
args: 'process --dry-run {workspace}'
about: Instant upgrades and automated refactoring of PHP code.
website: https://getrector.com
type: linter
technology: php
workspace_mode: ro
