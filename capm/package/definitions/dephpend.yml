image: php:8.4-cli-alpine
version: 0.9.0
install_command: |
  export COMPOSER_HOME=/opt/composer COMPOSER_ALLOW_SUPERUSER=1
  apk add git unzip
  wget -qO /usr/local/bin/composer https://getcomposer.org/download/latest-2.x/composer.phar
  chmod +x /usr/local/bin/composer
  composer global require dephpend/dephpend:{version}
entrypoint: /opt/composer/vendor/bin/dephpend
args: 'text {workspace}'
about: Dependency analysis tool for PHP.
website: https://github.com/mihaeu/dephpend
type: analyzer
technology: php
workspace_mode: ro
