image: php:8.4-cli-alpine
version: 2.3.1
install_command: |
  export COMPOSER_HOME=/opt/composer COMPOSER_ALLOW_SUPERUSER=1
  apk add git unzip
  wget -qO /usr/local/bin/composer https://getcomposer.org/download/latest-2.x/composer.phar
  chmod +x /usr/local/bin/composer
  composer global require phpstan/phpstan:{version}
entrypoint: /opt/composer/vendor/bin/phpstan
args: 'analyse --no-progress --memory-limit=1G {workspace}'
about: PHP Static Analysis Tool that discovers bugs in your code without running it.
website: https://phpstan.org
type: linter
technology: php
workspace_mode: ro
