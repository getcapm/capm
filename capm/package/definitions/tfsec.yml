image: alpine:3.24.2
version: 1.28.14
install_command: |
  apk add go
  go install github.com/aquasecurity/tfsec/cmd/tfsec@v{version}
entrypoint: /root/go/bin/tfsec
args: '{workspace}'
about: Security scanner for Terraform code that spots potential misconfigurations.
website: https://github.com/aquasecurity/tfsec
type: linter
technology: terraform
workspace_mode: ro
