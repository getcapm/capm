image: php:8.4-cli-alpine
version: 6.0.3
install_command: |
  export COMPOSER_HOME=/opt/composer COMPOSER_ALLOW_SUPERUSER=1
  apk add git unzip
  wget -qO /usr/local/bin/composer https://getcomposer.org/download/latest-2.x/composer.phar
  chmod +x /usr/local/bin/composer
  composer global require sebastian/phpcpd:{version}
entrypoint: /opt/composer/vendor/bin/phpcpd
args: '{workspace}'
about: Copy/Paste Detector for PHP code.
website: https://github.com/sebastianbergmann/phpcpd
type: duplication
technology: php
workspace_mode: ro
