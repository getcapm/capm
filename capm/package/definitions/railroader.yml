image: ruby:3.4-alpine
version: 4.3.8
install_command: |
  apk add build-base
  gem install railroader -v {version}
entrypoint: railroader
args: '{workspace}'
about: An open source static analysis security vulnerability scanner for Ruby on Rails applications.
website: https://railroader.org
type: linter
technology: ruby, rails
workspace_mode: ro
