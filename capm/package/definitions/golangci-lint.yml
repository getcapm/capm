image: alpine:3.24.2
version: 2.15.0
install_command: |
  apk add go
  go install github.com/golangci/golangci-lint/v2/cmd/golangci-lint@v{version}
entrypoint: /root/go/bin/golangci-lint
args: 'run {workspace}/...'
about: Fast linters runner for Go with a unified configuration and output format.
website: https://golangci-lint.run
type: linter
technology: go
workspace_mode: ro
