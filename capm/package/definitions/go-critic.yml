image: alpine:3.24.2
version: 0.15.0
install_command: |
  apk add go
  go install github.com/go-critic/go-critic/cmd/gocritic@v{version}
entrypoint: /root/go/bin/gocritic
args: 'check {workspace}/...'
about: Go source code linter with checks that are not implemented in other linters.
website: https://github.com/go-critic/go-critic
type: linter
technology: go
workspace_mode: ro
