image: php:8.4-cli-alpine
version: 0.9.1
install_command: |
  export COMPOSER_HOME=/opt/composer COMPOSER_ALLOW_SUPERUSER=1
  apk add git unzip
  wget -qO /usr/local/bin/composer https://getcomposer.org/download/latest-2.x/composer.phar
  chmod +x /usr/local/bin/composer
  composer global require rskuipers/php-assumptions:{version}
entrypoint: /opt/composer/vendor/bin/phpa
args: '{workspace}'
about: Static code analysis tool that checks PHP code for weak assumptions.
website: https://github.com/rskuipers/php-assumptions
type: linter
technology: php
workspace_mode: ro
