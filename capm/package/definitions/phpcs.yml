image: php:8.4-cli-alpine
version: 4.0.4
install_command: |
  export COMPOSER_HOME=/opt/composer COMPOSER_ALLOW_SUPERUSER=1
  apk add git unzip
  wget -qO /usr/local/bin/composer https://getcomposer.org/download/latest-2.x/composer.phar
  chmod +x /usr/local/bin/composer
  composer global require squizlabs/php_codesniffer:{version}
entrypoint: /opt/composer/vendor/bin/phpcs
args: '{workspace}'
about: Detects violations of a defined set of coding standards in PHP code.
website: https://github.com/PHPCSStandards/PHP_CodeSniffer
type: linter
technology: php
workspace_mode: ro
