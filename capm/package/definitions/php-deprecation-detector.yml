image: php:8.4-cli-alpine
version: 2.0.33
install_command: |
  export COMPOSER_HOME=/opt/composer COMPOSER_ALLOW_SUPERUSER=1
  apk add git unzip
  wget -qO /usr/local/bin/composer https://getcomposer.org/download/latest-2.x/composer.phar
  chmod +x /usr/local/bin/composer
  composer global require wapmorgan/php-deprecation-detector:{version}
entrypoint: /opt/composer/vendor/bin/phpdd
args: '{workspace}'
about: Finds usage of functionality that is deprecated or removed in newer PHP versions.
website: https://github.com/wapmorgan/PhpDeprecationDetector
type: linter
technology: php
workspace_mode: ro
