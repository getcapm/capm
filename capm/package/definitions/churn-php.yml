image: php:8.4-cli-alpine
version: 1.7.3
install_command: |
  export COMPOSER_HOME=/opt/composer COMPOSER_ALLOW_SUPERUSER=1
  apk add git unzip
  wget -qO /usr/local/bin/composer https://getcomposer.org/download/latest-2.x/composer.phar
  chmod +x /usr/local/bin/composer
  composer global require bmitch/churn-php:{version}
entrypoint: /opt/composer/vendor/bin/churn
args: 'run {workspace}'
about: Helps discover good candidates for refactoring by combining code complexity and change frequency.
website: https://github.com/bmitch/churn-php
type: complexity
technology: php
workspace_mode: ro
