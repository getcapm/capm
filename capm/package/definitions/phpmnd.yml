image: php:8.4-cli-alpine
version: 3.6.1
install_command: |
  export COMPOSER_HOME=/opt/composer COMPOSER_ALLOW_SUPERUSER=1
  apk add git unzip
  wget -qO /usr/local/bin/composer https://getcomposer.org/download/latest-2.x/composer.phar
  chmod +x /usr/local/bin/composer
  composer global require povils/phpmnd:{version}
entrypoint: /opt/composer/vendor/bin/phpmnd
args: '{workspace}'
about: Helps to detect magic numbers in PHP code.
website: https://github.com/povils/phpmnd
type: linter
technology: php
workspace_mode: ro
