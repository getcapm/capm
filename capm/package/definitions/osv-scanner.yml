image: alpine:3.24.2
version: 2.7.0
install_command: |
  apk add go
  go install github.com/google/osv-scanner/v2/cmd/osv-scanner@v{version}
entrypoint: /root/go/bin/osv-scanner
args: 'scan source -r {workspace}'
about: Vulnerability scanner that checks project dependencies against the OSV.dev database.
website: https://osv.dev
type: analyzer
technology: polyglot
workspace_mode: ro
