image: alpine:3.24.2
version: 0.8.3
install_command: |
  apk add go
  go install golang.stackrox.io/kube-linter/cmd/kube-linter@v{version}
entrypoint: /root/go/bin/kube-linter
args: 'lint {workspace}'
about: Checks Kubernetes YAML files and Helm charts for security misconfigurations and best practices.
website: https://docs.kubelinter.io
type: linter
technology: kubernetes, helm
workspace_mode: ro
