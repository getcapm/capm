image: php:8.4-cli-alpine
version: 6.0.11
install_command: |
  export COMPOSER_HOME=/opt/composer COMPOSER_ALLOW_SUPERUSER=1
  apk add git unzip
  wget -qO /usr/local/bin/composer https://getcomposer.org/download/latest-2.x/composer.phar
  chmod +x /usr/local/bin/composer
  composer global require phan/phan:{version}
entrypoint: /opt/composer/vendor/bin/phan
args: '--no-config-file --allow-polyfill-parser --no-progress-bar --directory {workspace}'
about: A static analyzer for PHP that focuses on minimizing false positives.
website: https://github.com/phan/phan
type: linter
technology: php
workspace_mode: ro
