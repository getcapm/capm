image: alpine:3.24.2
version: 0.6.0
install_command: |
  apk add go
  go install github.com/fzipp/gocyclo/cmd/gocyclo@v{version}
entrypoint: /root/go/bin/gocyclo
args: '{workspace}'
about: Calculates cyclomatic complexities of functions in Go source code.
website: https://github.com/fzipp/gocyclo
type: complexity
technology: go
workspace_mode: ro
