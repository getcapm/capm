image: alpine:3.24.2
version: 0.8.0
install_command: |
  apk add go
  go install github.com/golangci/misspell/cmd/misspell@v{version}
entrypoint: /root/go/bin/misspell
args: '{workspace}'
about: Finds commonly misspelled English words in source code and text files.
website: https://github.com/golangci/misspell
type: linter
technology: polyglot
workspace_mode: ro
