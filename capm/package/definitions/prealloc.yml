image: alpine:3.24.2
version: 1.1.0
install_command: |
  apk add go
  go install github.com/alexkohler/prealloc@v{version}
entrypoint: /root/go/bin/prealloc
args: '{workspace}/...'
about: Finds Go slice declarations that could potentially be preallocated.
website: https://github.com/alexkohler/prealloc
type: linter
technology: go
workspace_mode: ro
