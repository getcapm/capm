[project]
name = "capm"
version = "0.10.1"
description = "Code Analysis Package Manager"
authors = [{ name = "Rob van der Leek", email = "robvanderleek@gmail.com" }]
readme = "README.md"
license = "GPL-3.0-or-later"
requires-python = ">=3.10,<3.15"
dependencies = [
    "docker>=7.2.0",
    "halo>=0.0.31",
    "inquirer>=3.4.1",
    "pyyaml>=6.0.3",
    "typer>=0.24.1",
]

[project.urls]
Changelog = "https://github.com/getcapm/capm/blob/master/CHANGELOG.md"
Documentation = "https://getcapm.github.io"
Source = "https://github.com/getcapm/capm"

[project.scripts]
capm = "capm.__main__:main"

[dependency-groups]
dev = [
    "poethepoet>=0.42.1",
    "pyinstaller>=6.19.0",
    "pytest>=9.1.1",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.poe.tasks.bundle]
help = "Create a binary executable using pyinstaller"
cmd = "pyinstaller --workpath .build --clean --noconfirm --specpath dist --add-data ../capm/package/definitions:capm/package/definitions --copy-metadata readchar -n capm -F capm/__main__.py"

[tool.semantic_release]
branch = "main"
version_toml = [ "pyproject.toml:project.version" ]
version_variables = [ "capm/version.py:version" ]
upload_to_repository = false
upload_to_release = false
allow_zero_version = true
